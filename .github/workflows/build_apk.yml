name: Build Standalone Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Re-generate Android Project Structure
        run: flutter create . --platforms=android --org=com.jarvis.app

      - name: Configure App Display Name to J.A.R.V.I.S.
        run: |
          sed -i 's/android:label="jarvis_app"/android:label="J.A.R.V.I.S."/g' android/app/src/main/AndroidManifest.xml

      - name: Inject Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml

      - name: Generate Black & White Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p assets
          convert -size 512x512 xc:black \
            -fill white \
            -font DejaVu-Sans-Bold \
            -pointsize 64 \
            -gravity center \
            -draw "text 0,0 'J.A.R.V.I.S.'" \
            assets/icon.png
          
          cat << 'EOF' > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: true
            ios: true
            image_path: "assets/icon.png"
            adaptive_icon_background: "#000000"
            adaptive_icon_foreground: "assets/icon.png"
          EOF

      - name: Install Dependencies & Build Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Arm64 Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
