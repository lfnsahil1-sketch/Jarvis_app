name: Build Standalone Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Generate Fresh Android Structure
        run: flutter create . --platforms=android --org=com.jarvis.app --overwrite

      - name: Auto-Fix Permissions, App Name, and Theme
        run: |
          # 1. Set App Display Name to J.A.R.V.I.S.
          sed -i 's/android:label="[^"]*"/android:label="J.A.R.V.I.S."/g' android/app/src/main/AndroidManifest.xml
          
          # 2. Fix ValueTheme error automatically if present
          sed -i 's/@style\/ValueTheme/@style\/NormalTheme/g' android/app/src/main/AndroidManifest.xml

          # 3. Inject network and audio permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml

      - name: Clean Cache and Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Arm64 Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
