name: Build Standalone Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Runs automatically every day at 12:00 AM UTC
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Re-create Clean Android Structure
        run: flutter create . --platforms=android --org=com.jarvis.app --overwrite

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Arm64 Release APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define=APP_NAME="J.A.R.V.I.S."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
            
